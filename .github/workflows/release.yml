name: Release
# Push a tag like v0.2.0 and this builds tinker.app, zips it, and attaches
# it to a GitHub Release. Ad-hoc signed unless the Developer ID secrets
# below exist, in which case the app is signed, notarized and stapled so
# it opens on any Mac without the quarantine dance.
#
# Optional secrets:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application .p12
#   NOTARY_KEY, NOTARY_KEY_ID, NOTARY_ISSUER_ID   App Store Connect API key
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          swift run tingle-tests
          python3 tools/test_payload.py
          cmp device/tingle_main.py Sources/TingleCore/Resources/tingle_main.py

      - name: Import signing certificate
        if: env.CERT != ''
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p tmppass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p tmppass build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmppass build.keychain

      - name: Build bundle
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$CERT" ]; then
            VERSION="$VERSION" CODESIGN_IDENTITY="Developer ID Application" ./scripts/bundle.sh
          else
            VERSION="$VERSION" CODESIGN_IDENTITY="-" ./scripts/bundle.sh
          fi

      - name: Notarize and staple
        if: env.NOTARY_KEY_ID != ''
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" > /tmp/notary_key.p8
          ditto -c -k --keepParent dist/tinker.app dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip --key /tmp/notary_key.p8 \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/tinker.app
          rm /tmp/notary_key.p8

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/tinker.app "dist/tinker-$VERSION.zip"
          shasum -a 256 "dist/tinker-$VERSION.zip" > "dist/tinker-$VERSION.zip.sha256"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$CERT" ]; then SIGNED="Signed and notarized: opens on any Mac."; else
            SIGNED="Ad-hoc signed: after unzipping run \`xattr -dr com.apple.quarantine tinker.app\` (or right-click → Open) before the first launch, and grant Microphone + Accessibility when asked."; fi
          NOTES="$SIGNED"$'\n\n'"Install: unzip, move tinker.app to /Applications, launch. A ting set up on another Mac is recognised as soon as it is docked - no re-flash."
          gh release create "$GITHUB_REF_NAME" "dist/tinker-$VERSION.zip" "dist/tinker-$VERSION.zip.sha256" \
            --title "tinker $VERSION" \
            --notes "$NOTES"
